# PRISM -- conda environment
#
#   conda env create -f environment.yml
#   conda activate prism
#   pip install -e .        # builds the CUDA extensions of the forward model
#
# The CUDA toolkit is installed INSIDE the environment (cuda-nvcc/cuda-toolkit)
# so that `pip install -e .` can compile the two extensions without a system
# CUDA installation. Only the NVIDIA driver has to be present on the host.
#
# Change the `pytorch-cuda` version and the `--index-url` below together if you
# need a different CUDA runtime than 11.8.
name: prism

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.10
  - pip
  # --- PyTorch (CUDA 11.8) ---------------------------------------------------
  - pytorch=2.3.0
  - torchvision=0.18.0
  - pytorch-cuda=11.8
  # --- compiling the CUDA extensions -----------------------------------------
  - cuda-nvcc=11.8.*
  - cuda-cudart-dev=11.8.*
  - cuda-libraries-dev=11.8.*
  - gxx_linux-64=11.*
  - ninja
  - setuptools=69.5.1
  # --- numerics --------------------------------------------------------------
  - numpy=1.26.4
  - pandas=2.2.2
  - scipy=1.15.3
  - matplotlib=3.9.3
  - pillow=9.3.0
  - pip:
      # --- deep learning ---
      - lightning==2.6.1
      - monai==1.3.0
      - torchio==0.20.14
      # --- medical image I/O ---
      - nibabel==5.3.2
      - SimpleITK==2.3.1
      # --- configuration ---
      - hydra-core==1.3.2
      - hydra-colorlog==1.2.0
      - omegaconf==2.3.0
      - python-dotenv==1.0.0
      - rootutils==1.0.7
      # --- logging / progress ---
      - rich==13.7.0
      - tqdm==4.66.4
      - wandb==0.16.2
      # --- analysis / preprocessing only (see requirements.txt) ---
      - antspyx==0.4.2
      - scikit-image==0.22.0
