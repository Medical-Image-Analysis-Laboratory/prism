# @package _global_

defaults:
  - override /data: datamodule
  - override /model: srrsvortreg
  - override /callbacks: default
  - override /trainer: gpu

task_name: simrealgood
output_dir: ${paths.sim_test_dir}/Good

data:
  train_type: real # "synth", "real"
  val_type: real # "synth", "real"

  # data source (otherwise the datamodule's /path/to/... placeholders are used)
  split_file: ${paths.train_data_dir}/participants.csv
  bids_path: ${paths.train_data_dir}
  seed_path: null
  val_split: test
  # BIDS suffixes of the reference volumes and their segmentations, i.e.
  # <sub>[_<ses>]*_<suffix>.nii.gz -- adapt to your files.
  img_suffix: T2wbiascorrected
  seg_suffix: dseg

  scanner:
    _target_: synthgen.generator.scanner.Scanner
    cfg_scanner:
      resolution_slice_fac: [1.0, 2.0]
      resolution_slice_max: 2.0
      slice_thickness:
        - 2.5
        - 5.0
      gap:
        - 2.5
        - 5.0
      resolution_recon: 1.0
      min_num_stack: 6
      max_num_stack: 12
      max_num_slices: 600
      noise_sigma:
        - 0.0
        - 0.001
      TR:
        - 1
        - 2
      # artifacts
      prob_void: 0.0
      prob_motion: 0.0
      max_missing_slices: 0.0
      # bias field parameters
      bias_strength_max: 0.05
      bias_strength_min: 0.02
      bias_percentage_max: 0.0
      # intensity shift parameters
      intensity_slice_std: 0.1
      intensity_slice_prb: 0.0

      skull_strip: 1.0 # false by default 
      slice_size: 128
      restrict_transform: true
      txy: 1
