defaults:
  # important configs defining data and model
  - data: datamodule
  - model: srrsvortreg
  # configs defining logging and callbacks
  - callbacks: default
  - logger: wandb
  - trainer: default
  - paths: default
  - extras: default
  - hydra: default
  - _self_


model:
  n_iter: 4
  cg_iter: 4
  freezesvr: false
  freezerreg: false
  freezesqm: true
  # inference: false

  sqm: 
    _target_: "synthgen.models.sbqm.QualityNet"

  # Training-only criterion: never built for evaluation, so no MedicalNet
  # download is needed to reproduce the numbers.
  perceptual_loss: null

  lr: 5.0e-5

  # Supervised loss (Eq. 9): anchor-point + rotation/translation on the pose and
  # smooth-L1 on the reconstruction, every term SUMMED over the registration
  # iterations (deep supervision), as in the reference SVoRT implementation.
  weight_point: 0.1
  weight_img: 500.0
  weight_qa: 0.0        # dense QA supervised against the GT artifact map
  weight_R: 10.0
  weight_T: 0.01

  # Bias-field and intensity-scale heads are unsupervised here (weight 0): the
  # simulated artefacts are left uncorrected and the SQM down-weights them.
  weight_intshift: 0.0
  weight_bias: 0.0

  # Self-supervised terms: off, the simulated data comes with full ground truth.
  weight_dc: 0.0
  weight_qa_reg: 0.0
  qa_target: 0.0
  weight_tv: 0.0
  weight_perceptual: 0.0
  weight_gradloss: 0.0

  # MoDL proximal weights lambda_k: one per TRAINED registration iteration
  # (3). Must match training, so the checkpoint's values load; when `n_iter`
  # above is larger, the extra iterations reuse the last trained lambda.
  reg_lambda_init: 0.5
  n_reg_lambda: 3

  # The learned prior: one residual 3D denoiser per registration iteration
  # (untied). `null` disables it, which is the SVoRT / SVoRT(+Q) ablation.
  regularizer:
    _target_: torch.nn.ModuleList
    modules:
      - _target_: synthgen.models.regularizers.DenoisingResUNet3D
        in_channels: 1
        out_channels: 1
        channels: [16, 32, 64, 128]
        up_sample_mode: pixelshuffle
        strides: [2, 2, 2]
      - _target_: synthgen.models.regularizers.DenoisingResUNet3D
        in_channels: 1
        out_channels: 1
        channels: [16, 32, 64, 128]
        up_sample_mode: pixelshuffle
        strides: [2, 2, 2]
      - _target_: synthgen.models.regularizers.DenoisingResUNet3D
        in_channels: 1
        out_channels: 1
        channels: [16, 32, 64, 128]
        up_sample_mode: pixelshuffle
        strides: [2, 2, 2]


# Which reconstruction to save and score:
#   dc          - the plain data-consistency solve at the final estimated poses
#                 (Eq. 2), i.e. the protocol reported in the paper
#   regularized - the prior-regularized volume the SVR loop refines poses against
recon: dc

save_volumes: true
save_slices: true
save_stacks: false

save_path: ${paths.sim_test_dir}/Bad/derivatives/predictions

ckpt_paths: []

data:
  reconstructed_volume_shape: [128, 128, 128]
  split_file: ${paths.sim_test_dir}/splits.csv
  bids_path: ${paths.sim_test_dir}/Bad
  train_split: train
  val_split: NO # "synth", "real", "test"
  val_type: real #
  test_split: test
  seed_path: null
  train_type: real # 
  img_suffix: T2wbiascorrected
  seg_suffix: null

  scanner:
    _target_: synthgen.generator.scanner.Scanner
    cfg_scanner:
      resolution_slice_fac: [1.0, 2.0]
      resolution_slice_max: 1.5
      slice_thickness:
        - 2.5
        - 3.5
      gap:
        - 2.5
        - 3.5
      resolution_recon: 1.0
      min_num_stack: 3
      max_num_stack: 3
      max_num_slices: 200
      noise_sigma:
        - 0.0
        - 0.03
      TR:
        - 1
        - 2
      prob_void: 0.03
      prob_motion: 0.00
      slice_size: 128
      restrict_transform: false
      txy: 3

  num_workers: 4
  batch_size: 1

  generator:
    resolution:
      - 1.0
      - 1.0
      - 1.0
    shape:
      - 128
      - 128
      - 128
    # intensity generation, ~ 500ms
    image_transforms:
      _target_: torchio.transforms.Compose
      transforms:
        # scale image to [0, 1]
        - _target_: torchio.transforms.RescaleIntensity
          out_min_max: [0, 1]




metrics:
  - mse

device: cuda:0



hydra:
  run:
    dir: .
  output_subdir: null

task_name: "eval"

tags: ["dev"]
